name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"

env:
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  HETZNER_CLOUD_KEY: ${{ secrets.HETZNER_CLOUD_KEY }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  CLOUDFLARE_TUNNEL_SECRET: ${{ secrets.CLOUDFLARE_TUNNEL_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm ci

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub

      - name: Install Ansible + collections
        run: |
          pip install ansible pyyaml
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup Pulumi
        uses: pulumi/actions@v5

      - name: Configure Pulumi
        # Category A only — cloud provider credentials that Pulumi providers need.
        # Category B (Ansible-only secrets) are passed as env vars on the deploy step.
        run: |
          pulumi stack select codigo/mau-app/codigo-services

          # AWS
          pulumi config set aws:region ${{ vars.AWS_REGION }}
          pulumi config set --secret awsAccessKeyId "${{ secrets.AWS_ACCESS_KEY_ID }}"
          pulumi config set --secret awsSecretAccessKey "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

          # Hetzner
          pulumi config set --secret hcloud:token ${{ secrets.HETZNER_CLOUD_KEY }}

          # SSH public key (used to provision Hetzner VPS + passed to Ansible bootstrap)
          cat ~/.ssh/id_rsa.pub | openssl base64 | tr -d '\n' | pulumi config set sshPublicKey --secret

          # Cloudflare
          pulumi config set --secret cloudflareAccountId "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          pulumi config set --secret cloudflareCodigoZoneId "${{ secrets.CLOUDFLARE_CODIGO_ZONE_ID }}"
          pulumi config set --secret cloudflareMaumercadoZoneId "${{ secrets.CLOUDFLARE_MAUMERCADO_ZONE_ID }}"
          pulumi config set --secret cloudflare:apiToken "${{ secrets.CLOUDFLARE_API_TOKEN }}"

        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Deploy infrastructure
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: codigo/mau-app/codigo-services
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          # ── Category B: Ansible reads these directly via lookup('env') ──────
          # Infisical bootstrap secrets (GitHub-only — circular dependency)
          INFISICAL_ENCRYPTION_KEY: ${{ secrets.INFISICAL_ENCRYPTION_KEY }}
          INFISICAL_AUTH_SECRET: ${{ secrets.INFISICAL_AUTH_SECRET }}
          INFISICAL_DB_PASSWORD: ${{ secrets.INFISICAL_DB_PASSWORD }}
          INFISICAL_SMTP_PASSWORD: ${{ secrets.INFISICAL_SMTP_PASSWORD }}
          # Dozzle (Infisical codigo project → GitHub Sync)
          DOZZLE_USERNAME: ${{ secrets.DOZZLE_USERNAME }}
          DOZZLE_PASSWORD: ${{ secrets.DOZZLE_PASSWORD }}
          # Container registry (Infisical codigo project → GitHub Sync)
          DOCKER_REGISTRY: ${{ vars.CONTAINER_REGISTRY_URL }}
          DOCKER_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          # Backup (GitHub Variable)
          BACKUP_DIR: ${{ vars.BACKUP_DIR }}
          # Grafana (Infisical codigo project → GitHub Sync)
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      - name: Publish private network outputs to Reporter Infisical
        continue-on-error: true
        run: |
          if [ -z "$REPORTER_INFISICAL_PROJECT_ID" ] || [ -z "$INFISICAL_SYNC_CLIENT_ID" ] || [ -z "$INFISICAL_SYNC_CLIENT_SECRET" ]; then
            echo "Skipping Reporter Infisical sync; missing project ID or machine identity credentials."
            exit 0
          fi

          npm install -g @infisical/cli

          export INFISICAL_DISABLE_UPDATE_CHECK=true
          export INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --domain="$INFISICAL_DOMAIN" \
            --client-id="$INFISICAL_SYNC_CLIENT_ID" \
            --client-secret="$INFISICAL_SYNC_CLIENT_SECRET" \
            --silent \
            --plain)

          STACK_OUTPUTS=$(pulumi stack output --json --stack codigo/mau-app/codigo-services)
          export STACK_OUTPUTS

          HETZNER_PRIVATE_NETWORK_ID=$(python3 -c 'import json, os; print(json.loads(os.environ["STACK_OUTPUTS"])["hetznerPrivateNetworkId"])')

          TOOLING_VPS_PRIVATE_IP=$(python3 -c 'import json, os; print(json.loads(os.environ["STACK_OUTPUTS"])["toolingPrivateIpOut"])')

          infisical secrets set \
            HETZNER_PRIVATE_NETWORK_ID="$HETZNER_PRIVATE_NETWORK_ID" \
            TOOLING_VPS_PRIVATE_IP="$TOOLING_VPS_PRIVATE_IP" \
            --projectId="$REPORTER_INFISICAL_PROJECT_ID" \
            --env=production \
            --path=/infrastructure \
            --silent
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          INFISICAL_DOMAIN: https://locker.codigo.sh
          REPORTER_INFISICAL_PROJECT_ID: ${{ secrets.REPORTER_INFISICAL_PROJECT_ID }}
          INFISICAL_SYNC_CLIENT_ID: ${{ secrets.INFISICAL_SYNC_CLIENT_ID }}
          INFISICAL_SYNC_CLIENT_SECRET: ${{ secrets.INFISICAL_SYNC_CLIENT_SECRET }}

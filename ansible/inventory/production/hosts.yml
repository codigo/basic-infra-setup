---
# Server IP is passed at runtime via --extra-vars 'server_ip=<IP>'
# from Pulumi after VPS provisioning.
# For local runs: ansible-playbook -i '5.78.86.194,' ...
all:
  children:
    managers:
      hosts:
        tooling-vps:
          ansible_host: "{{ server_ip | default('5.78.86.194') }}"
          ansible_user: codigo
          ansible_ssh_private_key_file: "{{ ssh_key_path | default('~/code/codigo-projects/ssh-keys/id_rsa') }}"
      vars:
        swarm_role: manager
    workers:
      hosts: {}

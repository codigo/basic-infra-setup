---
# ── Directory structure ───────────────────────────────────────────────────────
- name: Create monitoring config/compose directory structure (owned by codigo)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: codigo
    group: codigo
    mode: "0755"
  loop:
    - "{{ monitoring_dir }}/config/grafana/provisioning/datasources"
    - "{{ monitoring_dir }}/config/grafana/provisioning/dashboards"

# Data directories must be owned by the UIDs the containers run as:
#   Loki      → UID 10001
#   Prometheus → UID 65534 (nobody)
#   Grafana   → UID 472
- name: Create Loki data directory (UID 10001)
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/data/loki"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"

- name: Create Prometheus data directory (UID 65534 / nobody)
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/data/prometheus"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0755"

- name: Create Grafana data directory (UID 472)
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/data/grafana"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"

# ── Config file templates ─────────────────────────────────────────────────────
- name: Template Loki config
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ monitoring_dir }}/config/loki.yml"
    owner: codigo
    group: codigo
    mode: "0644"

- name: Template Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/config/prometheus.yml"
    owner: codigo
    group: codigo
    mode: "0644"

- name: Template Grafana datasources
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ monitoring_dir }}/config/grafana/provisioning/datasources/datasources.yml"
    owner: codigo
    group: codigo
    mode: "0644"

- name: Copy docker-compose.monitoring.yaml
  ansible.builtin.template:
    src: docker-compose.monitoring.yaml.j2
    dest: "{{ monitoring_dir }}/docker-compose.monitoring.yaml"
    owner: codigo
    group: codigo
    mode: "0644"

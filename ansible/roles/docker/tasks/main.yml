---
# ── Docker CE install ─────────────────────────────────────────────────────────
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    keyring: /usr/share/keyrings/docker-archive-keyring.gpg
    state: present

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true
  notify: Enable and start Docker

- name: Add codigo user to docker group
  ansible.builtin.user:
    name: codigo
    groups:
      - docker
    append: true

- name: Install Python Docker SDK and dependencies via apt (avoids pip bootstrap issues)
  ansible.builtin.apt:
    name:
      - python3-docker
      - python3-jsondiff
      - python3-yaml
    state: present
    update_cache: false

# ── Docker Swarm init ─────────────────────────────────────────────────────────
- name: Initialize Docker Swarm
  community.docker.docker_swarm:
    state: present
  register: swarm_result
  # In check mode, python3-docker may not yet be installed
  ignore_errors: "{{ ansible_check_mode }}"

- name: Store worker join token as fact
  ansible.builtin.set_fact:
    swarm_worker_join_token: "{{ swarm_result.swarm_facts.JoinTokens.Worker }}"
  when: swarm_result.swarm_facts is defined

# ── Overlay networks ──────────────────────────────────────────────────────────
- name: Remove legacy internal_net if present
  community.docker.docker_network:
    name: internal_net
    state: absent
  ignore_errors: true

- name: Create overlay networks
  community.docker.docker_network:
    name: "{{ item.name }}"
    driver: "{{ item.driver }}"
    attachable: "{{ item.attachable }}"
    scope: swarm
    state: present
  loop: "{{ docker_networks }}"
  # In check mode, python3-docker may not yet be installed
  ignore_errors: "{{ ansible_check_mode }}"

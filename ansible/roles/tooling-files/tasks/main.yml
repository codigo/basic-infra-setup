---
# ── Directory structure ───────────────────────────────────────────────────────
- name: Create tooling directory structure (owned by codigo)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: codigo
    group: codigo
    mode: "0755"
  loop:
    - "{{ bin_dir }}"
    - "{{ logs_dir }}"
    - "{{ tooling_dir }}/data/caddy/config"
    - "{{ tooling_dir }}/data/caddy/data"
    - "{{ tooling_dir }}/data/dozzle"
    - "{{ tooling_dir }}/bin/cloudflared"
    - "{{ tooling_dir }}/data/infisical/redis"

# postgres:18-alpine runs as UID 70 and requires its data dir to be owned by
# that UID with mode 0700 — if the dir is owned by a different UID postgres
# cannot initialise and silently falls back to an anonymous Docker volume,
# which is destroyed by `docker stack rm`. This task is idempotent: if the
# dir already has the correct owner/mode Ansible makes no change.
- name: Create Infisical postgres data directory (UID 70 — postgres:alpine)
  ansible.builtin.file:
    path: "{{ tooling_dir }}/data/infisical/postgres"
    state: directory
    owner: "70"
    group: "70"
    mode: "0700"

# Remove any stale non-postgres files that would prevent postgres from
# initialising the data directory (e.g. a backup.sql left by an old backup run).
- name: Remove stale files from postgres data directory
  ansible.builtin.shell: |
    find {{ tooling_dir }}/data/infisical/postgres -maxdepth 1 -type f \
      ! -name 'PG_VERSION' ! -name 'postgresql.conf' ! -name 'pg_hba.conf' \
      -delete
  args:
    executable: /bin/bash
  changed_when: false

# ── Config file templates ─────────────────────────────────────────────────────
- name: Template docker-compose.tooling.yaml
  ansible.builtin.template:
    src: docker-compose.tooling.yaml.j2
    dest: "{{ tooling_dir }}/docker-compose.tooling.yaml"
    owner: codigo
    group: codigo
    mode: "0644"

- name: Template Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ tooling_dir }}/data/caddy/Caddyfile"
    owner: codigo
    group: codigo
    mode: "0644"

- name: Template dozzle users.yaml
  ansible.builtin.template:
    src: dozzle-users.yaml.j2
    dest: "{{ tooling_dir }}/data/dozzle/users.yaml"
    owner: codigo
    group: codigo
    mode: "0600"

# ── Backup scripts ────────────────────────────────────────────────────────────
- name: Copy backup scripts to bin/
  ansible.builtin.copy:
    # Source is the repo-root bin/ directory — single source of truth.
    # The role files/ copies were duplicates; using absolute src avoids drift.
    src: "{{ playbook_dir }}/../../bin/{{ item.src }}"
    dest: "{{ bin_dir }}/{{ item.dest }}"
    owner: codigo
    group: codigo
    mode: "0755"
  loop:
    - { src: backupData.js, dest: backupData.js }
    - { src: uploadToS3.js, dest: uploadToS3.js }
    - { src: restoreAndCopyBackup.js, dest: restoreBackup.js }

- name: Check if package.json exists in bin/
  ansible.builtin.stat:
    path: "{{ bin_dir }}/package.json"
  register: bin_package_json

- name: Init npm in bin/ if needed
  ansible.builtin.command:
    cmd: npm init -y
    chdir: "{{ bin_dir }}"
  become: true
  become_user: codigo
  when: not bin_package_json.stat.exists

- name: Install AWS SDK for backup scripts
  community.general.npm:
    path: "{{ bin_dir }}"
    name: "@aws-sdk/client-s3"
    state: present
  become: true
  become_user: codigo

# ── Cron jobs ─────────────────────────────────────────────────────────────────
- name: Remove legacy unnamed cron entries (replaced by named Ansible cron tasks)
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
    user: codigo
  loop:
    - "UNNAMED_backupData"
    - "UNNAMED_uploadToS3"
  # The old entries have no name — use a shell task to remove them by pattern
  ignore_errors: true

- name: Remove old Pulumi-style cron entries by pattern
  ansible.builtin.shell: |
    crontab -l -u codigo 2>/dev/null | \
      grep -v 'backupData.js' | \
      grep -v 'uploadToS3.js' | \
      crontab -u codigo -
  args:
    executable: /bin/bash
  changed_when: false

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ logs_dir }}"
    state: directory
    owner: codigo
    group: codigo
    mode: "0755"

- name: Schedule backup cron job
  ansible.builtin.cron:
    name: "Run data backup"
    minute: "0"
    hour: "{{ backup_cron_hour }}"
    # Explicitly export required env vars so they survive the fnm exec subshell.
    # The scripts also have hardcoded fallbacks for safety.
    job: >-
      BACKUP_DIR={{ backup_dir }}
      APP_BUCKET={{ app_bucket }}
      AWS_REGION={{ aws_region }}
      AWS_ACCESS_KEY_ID={{ aws_access_key_id }}
      AWS_SECRET_ACCESS_KEY={{ aws_secret_access_key }}
      {{ fnm_dir }}/fnm exec --using={{ node_version }}
      node {{ bin_dir }}/backupData.js >> {{ logs_dir }}/backup.log 2>&1
    user: codigo
    state: present

- name: Schedule S3 upload cron job
  ansible.builtin.cron:
    name: "Upload backups to S3"
    minute: "30"
    hour: "{{ upload_cron_hour }}"
    job: >-
      BACKUP_DIR={{ backup_dir }}
      APP_BUCKET={{ app_bucket }}
      AWS_REGION={{ aws_region }}
      AWS_ACCESS_KEY_ID={{ aws_access_key_id }}
      AWS_SECRET_ACCESS_KEY={{ aws_secret_access_key }}
      {{ fnm_dir }}/fnm exec --using={{ node_version }}
      node {{ bin_dir }}/uploadToS3.js >> {{ logs_dir }}/upload.log 2>&1
    user: codigo
    state: present

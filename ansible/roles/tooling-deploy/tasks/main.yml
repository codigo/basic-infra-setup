---
# ── Container registry login ──────────────────────────────────────────────────
- name: Login to container registry
  community.docker.docker_login:
    registry_url: "{{ docker_registry }}"
    username: "{{ docker_username }}"
    password: "{{ docker_password }}"
    reauthorize: true

# ── Rotate secrets (Docker Swarm forbids updating secret content in-place) ────
- name: Remove existing tooling secrets so stack deploy can recreate them
  ansible.builtin.command:
    cmd: docker secret rm {{ item }}
  loop:
    - tooling_users
  ignore_errors: true
  changed_when: false

# ── Deploy tooling stack ──────────────────────────────────────────────────────
- name: Deploy tooling Docker stack
  community.docker.docker_stack:
    name: "{{ tooling_stack_name }}"
    state: present
    compose:
      - "{{ tooling_compose_path }}"
    with_registry_auth: true
    prune: true
  register: stack_deploy_result

- name: Wait for tooling stack services to stabilise
  ansible.builtin.pause:
    seconds: 30
  when: stack_deploy_result.changed

- name: List tooling stack services
  ansible.builtin.command:
    cmd: docker stack services {{ tooling_stack_name }}
  register: stack_services
  changed_when: false
  when: stack_deploy_result.changed

- name: Show stack services
  ansible.builtin.debug:
    var: stack_services.stdout_lines
  when: stack_deploy_result.changed and stack_services is defined
